services:
  - type: web
    name: bharat-ai-tutor
    env: node
    buildCommand: |
      apt-get update && \
      apt-get install -y python3-distutils build-essential python3-dev && \
      npm install && \
      pip3 install -r requirements.txt
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.18.0
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: CHROME_BIN
        value: /usr/bin/chromium
